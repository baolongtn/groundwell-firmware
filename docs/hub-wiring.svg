<svg xmlns="http://www.w3.org/2000/svg" width="680" height="445" viewBox="0 0 680 445" role="img">
<title>GROUNDWELL hub wiring (firmware 0.12)</title>
<desc>Sensors wired to a XIAO ESP32-C6 hub: capacitive probe AOUT on D0 and power on D1, photoresistor from D7 to D2 with 1 kOhm from D2 to GND, DHT11 data on D6, optional I2C sensors on D4 (SDA) and D5 (SCL). D3, D8, D9 and D10 are free.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-size:14px;fill:#2C2C2A} .th{font-size:14px;font-weight:500;fill:#2C2C2A} .ts{font-size:12px;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:.75}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.75} .teal-h{font-size:14px;font-weight:500;fill:#085041} .teal-s{font-size:12px;fill:#0F6E56}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.75} .gray-s{font-size:12px;fill:#444441}
.opt{fill:#FFFFFF;stroke:#888780;stroke-width:.75} .opt-h{font-size:14px;font-weight:500;fill:#2C2C2A} .opt-s{font-size:12px;fill:#5F5E5A}
</style>
<rect width="680" height="445" fill="#FDF6EE"/>
<rect class="box" x="318" y="40" width="44" height="14" rx="3"/>
<rect class="box" x="250" y="50" width="180" height="340" rx="8"/>
<text class="th" x="340" y="76" text-anchor="middle" dominant-baseline="central">XIAO ESP32-C6</text>
<text class="ts" x="340" y="94" text-anchor="middle" dominant-baseline="central">hub, USB-C power</text>
<text class="t" x="262" y="120" dominant-baseline="central">D0 / A0</text>
<text class="t" x="262" y="160" dominant-baseline="central">D1</text>
<text class="t" x="262" y="200" dominant-baseline="central">D2 / A2</text>
<text class="t" x="262" y="240" dominant-baseline="central">D3</text>
<text class="ts" x="290" y="240" dominant-baseline="central">free</text>
<text class="t" x="262" y="280" dominant-baseline="central">D4</text>
<text class="t" x="262" y="320" dominant-baseline="central">D5</text>
<text class="t" x="262" y="360" dominant-baseline="central">D6</text>
<text class="t" x="418" y="120" text-anchor="end" dominant-baseline="central">5V</text>
<text class="ts" x="394" y="120" text-anchor="end" dominant-baseline="central">unused</text>
<text class="t" x="418" y="160" text-anchor="end" dominant-baseline="central">GND</text>
<text class="t" x="418" y="200" text-anchor="end" dominant-baseline="central">3V3</text>
<text class="t" x="418" y="240" text-anchor="end" dominant-baseline="central">D10</text>
<text class="ts" x="385" y="240" text-anchor="end" dominant-baseline="central">free</text>
<text class="t" x="418" y="280" text-anchor="end" dominant-baseline="central">D9</text>
<text class="ts" x="394" y="280" text-anchor="end" dominant-baseline="central">free</text>
<text class="t" x="418" y="320" text-anchor="end" dominant-baseline="central">D8</text>
<text class="ts" x="394" y="320" text-anchor="end" dominant-baseline="central">free</text>
<text class="t" x="418" y="360" text-anchor="end" dominant-baseline="central">D7</text>
<line x1="190" y1="120" x2="246" y2="120" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="190" y1="160" x2="246" y2="160" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="190" y1="200" x2="246" y2="200" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="190" y1="280" x2="246" y2="280" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="190" y1="320" x2="246" y2="320" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="190" y1="360" x2="246" y2="360" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="434" y1="160" x2="458" y2="160" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="434" y1="200" x2="458" y2="200" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="434" y1="360" x2="458" y2="360" stroke="#5F5E5A" stroke-width="1.5"/>
<circle cx="250" cy="120" r="3.5" fill="#5F5E5A"/><circle cx="430" cy="120" r="3.5" fill="#D3D1C7"/>
<circle cx="250" cy="160" r="3.5" fill="#5F5E5A"/><circle cx="430" cy="160" r="3.5" fill="#5F5E5A"/>
<circle cx="250" cy="200" r="3.5" fill="#5F5E5A"/><circle cx="430" cy="200" r="3.5" fill="#5F5E5A"/>
<circle cx="250" cy="240" r="3.5" fill="#D3D1C7"/><circle cx="430" cy="240" r="3.5" fill="#D3D1C7"/>
<circle cx="250" cy="280" r="3.5" fill="#5F5E5A"/><circle cx="430" cy="280" r="3.5" fill="#D3D1C7"/>
<circle cx="250" cy="320" r="3.5" fill="#5F5E5A"/><circle cx="430" cy="320" r="3.5" fill="#D3D1C7"/>
<circle cx="250" cy="360" r="3.5" fill="#5F5E5A"/><circle cx="430" cy="360" r="3.5" fill="#5F5E5A"/>
<text class="ts" x="218" y="111" text-anchor="middle" dominant-baseline="central">AOUT</text>
<text class="ts" x="218" y="151" text-anchor="middle" dominant-baseline="central">VCC</text>
<text class="ts" x="218" y="191" text-anchor="middle" dominant-baseline="central">leg 2</text>
<text class="ts" x="218" y="271" text-anchor="middle" dominant-baseline="central">SDA</text>
<text class="ts" x="218" y="311" text-anchor="middle" dominant-baseline="central">SCL</text>
<text class="ts" x="218" y="351" text-anchor="middle" dominant-baseline="central">DATA</text>
<rect class="teal" x="30" y="100" width="160" height="80" rx="8"/>
<text class="teal-h" x="110" y="122" text-anchor="middle" dominant-baseline="central">Capacitive probe</text>
<text class="teal-s" x="110" y="142" text-anchor="middle" dominant-baseline="central">yellow D0, red D1</text>
<text class="teal-s" x="110" y="160" text-anchor="middle" dominant-baseline="central">black to GND</text>
<rect class="teal" x="30" y="186" width="160" height="62" rx="8"/>
<text class="teal-h" x="110" y="204" text-anchor="middle" dominant-baseline="central">Photoresistor</text>
<text class="teal-s" x="110" y="222" text-anchor="middle" dominant-baseline="central">leg 1 to D7</text>
<text class="teal-s" x="110" y="238" text-anchor="middle" dominant-baseline="central">1 kΩ from D2 to GND</text>
<rect class="opt" x="30" y="262" width="160" height="76" rx="8" stroke-dasharray="4 3"/>
<text class="opt-h" x="110" y="282" text-anchor="middle" dominant-baseline="central">I2C, optional</text>
<text class="opt-s" x="110" y="300" text-anchor="middle" dominant-baseline="central">SHT40 or AHT20, LTR390</text>
<text class="opt-s" x="110" y="318" text-anchor="middle" dominant-baseline="central">VIN 3V3, GND</text>
<rect class="teal" x="30" y="346" width="160" height="56" rx="8"/>
<text class="teal-h" x="110" y="364" text-anchor="middle" dominant-baseline="central">DHT11</text>
<text class="teal-s" x="110" y="384" text-anchor="middle" dominant-baseline="central">+ to 3V3, − to GND</text>
<rect class="gray" x="460" y="146" width="180" height="28" rx="6"/>
<text class="gray-s" x="550" y="160" text-anchor="middle" dominant-baseline="central">probe, DHT11, 1 kΩ, I2C</text>
<rect class="gray" x="460" y="186" width="180" height="28" rx="6"/>
<text class="gray-s" x="550" y="200" text-anchor="middle" dominant-baseline="central">DHT11 +, I2C VIN</text>
<rect class="teal" x="460" y="346" width="180" height="28" rx="6"/>
<text class="teal-s" x="550" y="360" text-anchor="middle" dominant-baseline="central">photoresistor leg 1</text>
<text class="ts" x="340" y="425" text-anchor="middle" dominant-baseline="central">Same wiring as a node, except the photoresistor reads on D2. Dashed: optional.</text>
</svg>
